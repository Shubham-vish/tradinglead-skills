  - id: life.backtest-library
    name: "AI TEST backtest: export, save to library, update metadata, export saved copy, then delete both"
    category: workflow
    tags: ["backtesting", "library", "slow"]
    setup:
      - id: history
        type: backtesting.list
        params: {"offset": 0, "limit": 5}
      - id: run
        type: backtesting.run
        params: {"language": "pine", "source": "//@version=5\nstrategy(\"AI TEST SMA cross\", overlay=true, initial_capital=100000)\nfastLen = input.int(10, \"Fast\", minval=2)\nslowLen = input.int(30, \"Slow\", minval=3)\nfast = ta.sma(close, fastLen)\nslow = ta.sma(close, slowLen)\nif ta.crossover(fast, slow)\n    strategy.entry(\"Long\", strategy.long)\nif ta.crossunder(fast, slow)\n    strategy.close(\"Long\")\n", "bars": 300, "range": null, "versionSuffix": "AI TEST {{run.id}}"}
        idempotencyKey: "ai-test-{{run.id}}-bt-run-backtestlibrary"
      - id: done
        kind: poll
        type: backtesting.get
        params: {"runId": "{{steps.run.data.runId}}", "limit": 1}
        until: {"path": "data.status", "oneOf": ["completed", "failed", "cancelled", "interrupted"]}
        intervalMs: 2000
        timeoutMs: 180000
      - id: export
        type: backtesting.export
        params: {"runId": "{{steps.run.data.runId}}", "expectedRevision": "{{steps.done.data.revision}}"}
      - id: save
        type: backtesting.librarySave
        params: {"runId": "{{steps.run.data.runId}}", "expectedRevision": "{{steps.done.data.revision}}", "expectedLibraryRevision": 0}
        idempotencyKey: "ai-test-{{run.id}}-bt-lib-save-backtestlibrary"
    execute:
      type: backtesting.libraryUpdate
      params: {"runId": "{{steps.run.data.runId}}", "expectedLibraryRevision": "{{steps.save.data.libraryRevision}}", "metadata": {"name": "AI TEST lib {{run.id}}", "notes": "automated - safe to delete", "tags": ["ai-test"]}}
      idempotencyKey: "ai-test-{{run.id}}-bt-lib-update-backtestlibrary"
    assert:
      response:
        - path: status
          equals: "ok"
        - path: data.runId
          equals: "{{steps.run.data.runId}}"
        - path: data.libraryRevision
          equals: 2
        - path: data.bytes
          gt: 0
      state:
        - label: "saved copy exports the same run"
          type: backtesting.libraryExport
          params: {"runId": "{{steps.run.data.runId}}"}
          assertions:
          - path: data.libraryRevision
            equals: 2
          - path: data.summary.runId
            equals: "{{steps.run.data.runId}}"
          - path: data.bytes
            gt: 0
        - label: "library lists the saved run"
          type: backtesting.libraryList
          params: {"limit": 25}
          assertions:
          - path: data.rows
            contains: {"runId": "{{steps.run.data.runId}}", "libraryRevision": 2}
        - label: "restoring an already-active run is refused"
          type: backtesting.libraryRestore
          params: {"runId": "{{steps.run.data.runId}}", "expectedLibraryRevision": 2}
          idempotencyKey: "ai-test-{{run.id}}-bt-lib-restore-backtestlibrary"
          assertions:
          - path: status
            equals: "error"
          - path: code
            equals: "REVISION_CONFLICT"
        - label: "optimization preview counts candidates without running"
          type: backtesting.researchPreview
          params: {"runId": "{{steps.run.data.runId}}", "expectedRevision": "{{steps.done.data.revision}}", "mode": "sweep", "grid": {"fastLen": [5, 10], "slowLen": [30]}}
          assertions:
          - path: data.total
            equals: 2
          - path: data.candidates.length
            equals: 2
    teardown:
      - id: libDelete
        type: backtesting.libraryDelete
        params: {"runId": "{{steps.run.data.runId}}", "expectedLibraryRevision": "{{steps.execute.data.libraryRevision}}"}
        idempotencyKey: "ai-test-{{run.id}}-bt-lib-delete-backtestlibrary"
      - id: latest
        type: backtesting.get
        params: {"runId": "{{steps.run.data.runId}}", "limit": 1}
      - id: deleteRun
        type: backtesting.delete
        params: {"runId": "{{steps.run.data.runId}}", "expectedRevision": "{{steps.latest.data.revision}}"}
        idempotencyKey: "ai-test-{{run.id}}-bt-delete-backtestlibrary"

