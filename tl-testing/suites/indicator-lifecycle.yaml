version: 1
suite:
  id: "indicator-lifecycle"
  name: "Indicator-grant lifecycles and error paths"
  description: "Creates only AI TEST research reports, Python sources, chart instances, native studies and Pine backtests on the current chart, verifies revisions/history/library round-trips, and deletes exactly the captured IDs in teardown. Panels opened by Studio saves are restored from the setup read. All other tests are unknown-ID / invalid-input paths that must fail before any change. Never touches existing user runs, presets or scripts."
  requires:
    grants: ["allowAgentIndicators"]
    signIn: true

tests:
  - id: life.research-report
    name: "AI TEST research report: create, update with revision guard, show, delete"
    category: workflow
    tags: ["research"]
    setup:
      - id: sidebarBefore
        type: workspace.getState
        params: {}
      - id: create
        type: research.create
        params: {"title": "AI TEST report {{run.id}}", "html": "<h1>AI TEST</h1><p>automated report - safe to delete</p>"}
        idempotencyKey: "ai-test-{{run.id}}-research-create-researchreport"
    execute:
      type: research.update
      params: {"id": "{{steps.create.data.id}}", "expectedRevision": "{{steps.create.data.revision}}", "title": "AI TEST report v2 {{run.id}}", "html": "<h1>AI TEST</h1><p>v2</p>"}
      idempotencyKey: "ai-test-{{run.id}}-research-update-researchreport"
    assert:
      response:
        - path: status
          equals: "ok"
        - path: data.id
          equals: "{{steps.create.data.id}}"
        - path: data.revision
          equals: 2
        - path: data.title
          equals: "AI TEST report v2 {{run.id}}"
        - path: data.persisted
          equals: true
      state:
        - label: "stored HTML is the replacement"
          type: research.get
          params: {"id": "{{steps.create.data.id}}"}
          assertions:
          - path: data.html
            equals: "<h1>AI TEST</h1><p>v2</p>"
          - path: data.revision
            equals: 2
        - label: "stale revision is rejected"
          type: research.update
          params: {"id": "{{steps.create.data.id}}", "expectedRevision": 1, "title": "AI TEST stale", "html": "<p>x</p>"}
          idempotencyKey: "ai-test-{{run.id}}-research-stale-researchreport"
          assertions:
          - path: status
            equals: "error"
          - path: code
            oneOf: ["REVISION_CONFLICT", "INVALID_PARAMS"]
        - label: "show selects the report"
          type: research.show
          params: {"id": "{{steps.create.data.id}}"}
          assertions:
          - path: data.selectedId
            equals: "{{steps.create.data.id}}"
        - label: "listed exactly once"
          type: research.list
          params: {}
          assertions:
          - path: data.reports
            contains: {"id": "{{steps.create.data.id}}"}
    teardown:
      - id: delete
        type: research.delete
        params: {"id": "{{steps.create.data.id}}", "expectedRevision": "{{steps.execute.data.revision}}"}
        idempotencyKey: "ai-test-{{run.id}}-research-delete-researchreport"
      - id: restoreSidebar
        type: workspace.openSidebar
        params: {"panel": "{{steps.sidebarBefore.data.sidebar.panel}}", "expanded": "{{steps.sidebarBefore.data.sidebar.expanded}}"}
      - id: sidebarRestored
        kind: poll
        type: workspace.getState
        params: {}
        until: {"path": "data.sidebar.panel", "equals": "{{steps.sidebarBefore.data.sidebar.panel}}"}
        intervalMs: 500
        timeoutMs: 10000

  - id: life.research-create-invalid
    name: "Research create rejects an empty title"
    category: contract
    tags: ["research", "errors"]
    execute:
      type: research.create
      params: {"title": "", "html": "<p>x</p>"}
      idempotencyKey: "ai-test-{{run.id}}-research-bad-researchcreateinvalid"
    assert:
      response:
        - path: status
          equals: "error"
        - path: code
          equals: "INVALID_PARAMS"

  - id: life.research-delete-unknown
    name: "Deleting an unknown report fails"
    category: contract
    tags: ["research", "errors"]
    execute:
      type: research.delete
      params: {"id": "ai-test-missing", "expectedRevision": 1}
      idempotencyKey: "ai-test-{{run.id}}-research-del-missing-researchdeleteunknown"
    assert:
      response:
        - path: status
          equals: "error"
        - path: code
          equals: "INVALID_PARAMS"

  - id: life.research-show-unknown
    name: "Showing an unknown report fails"
    category: contract
    tags: ["research", "errors"]
    execute:
      type: research.show
      params: {"id": "ai-test-missing"}
    assert:
      response:
        - path: status
          equals: "error"
        - path: code
          equals: "INVALID_PARAMS"

  - id: life.python-source-history
    name: "AI TEST Python source: save, revise, list history, restore revision 1, delete"
    category: workflow
    tags: ["python"]
    setup:
      - id: sidebarBefore
        type: workspace.getState
        params: {}
      - id: save
        type: pythonIndicators.save
        params: {"title": "AI TEST py {{run.id}}", "source": "def calculate(bars, params):\n    return {\"title\": \"AI TEST close\", \"overlay\": True, \"plots\": [{\"id\": \"close\", \"title\": \"Close\", \"color\": \"#22c55e\", \"values\": [bar[\"close\"] for bar in bars]}]}\n"}
        idempotencyKey: "ai-test-{{run.id}}-py-save-pythonsourcehistory"
      - id: save2
        type: pythonIndicators.save
        params: {"title": "AI TEST py {{run.id}}", "source": "def calculate(bars, params):\n    return {\"title\": \"AI TEST close\", \"overlay\": True, \"plots\": [{\"id\": \"close\", \"title\": \"Close\", \"color\": \"#22c55e\", \"values\": [bar[\"close\"] for bar in bars]}]}\n# v2\n", "id": "{{steps.save.data.id}}", "expectedRevision": "{{steps.save.data.revision}}"}
        idempotencyKey: "ai-test-{{run.id}}-py-save2-pythonsourcehistory"
    execute:
      type: pythonIndicators.restore
      params: {"id": "{{steps.save.data.id}}", "revision": 1, "expectedRevision": "{{steps.save2.data.revision}}"}
      idempotencyKey: "ai-test-{{run.id}}-py-restore-pythonsourcehistory"
    assert:
      response:
        - path: status
          equals: "ok"
        - path: data.id
          equals: "{{steps.save.data.id}}"
        - path: data.revision
          equals: 3
        - path: data.executed
          equals: false
        - path: data.persisted
          equals: true
      state:
        - label: "history lists three newest-first revisions"
          type: pythonIndicators.history
          params: {"id": "{{steps.save.data.id}}"}
          assertions:
          - path: data.versions.length
            equals: 3
          - path: data.versions.0.revision
            equals: 3
        - label: "restored source is revision 1 text"
          type: pythonIndicators.get
          params: {"id": "{{steps.save.data.id}}"}
          assertions:
          - path: data.source
            equals: "def calculate(bars, params):\n    return {\"title\": \"AI TEST close\", \"overlay\": True, \"plots\": [{\"id\": \"close\", \"title\": \"Close\", \"color\": \"#22c55e\", \"values\": [bar[\"close\"] for bar in bars]}]}\n"
          - path: data.revision
            equals: 3
    teardown:
      - id: delete
        type: pythonIndicators.delete
        params: {"id": "{{steps.save.data.id}}", "expectedRevision": "{{steps.execute.data.revision}}"}
        idempotencyKey: "ai-test-{{run.id}}-py-delete-pythonsourcehistory"
      - id: restoreBottom
        type: workspace.setPanel
        params: {"panel": "{{steps.sidebarBefore.data.panels.bottom.panel}}", "expanded": "{{steps.sidebarBefore.data.panels.bottom.expanded}}"}
      - id: bottomRestored
        kind: poll
        type: workspace.getState
        params: {}
        until: {"path": "data.panels.bottom.panel", "equals": "{{steps.sidebarBefore.data.panels.bottom.panel}}"}
        intervalMs: 500
        timeoutMs: 10000

  - id: life.python-save-invalid
    name: "Saving empty Python source is rejected"
    category: contract
    tags: ["python", "errors"]
    execute:
      type: pythonIndicators.save
      params: {"title": "AI TEST empty", "source": ""}
      idempotencyKey: "ai-test-{{run.id}}-py-save-bad-pythonsaveinvalid"
    assert:
      response:
        - path: status
          equals: "error"
        - path: code
          equals: "INVALID_PARAMS"

  - id: life.python-delete-unknown
    name: "Deleting an unknown Python source fails"
    category: contract
    tags: ["python", "errors"]
    execute:
      type: pythonIndicators.delete
      params: {"id": "ai-test-missing", "expectedRevision": 1}
      idempotencyKey: "ai-test-{{run.id}}-py-del-missing-pythondeleteunknown"
    assert:
      response:
        - path: status
          equals: "error"
        - path: code
          equals: "INVALID_PARAMS"

  - id: life.python-restore-unknown
    name: "Restoring an unknown Python source fails"
    category: contract
    tags: ["python", "errors"]
    execute:
      type: pythonIndicators.restore
      params: {"id": "ai-test-missing", "revision": 1, "expectedRevision": 2}
      idempotencyKey: "ai-test-{{run.id}}-py-restore-missing-pythonrestoreunknown"
    assert:
      response:
        - path: status
          equals: "error"
        - path: code
          equals: "INVALID_PARAMS"

  - id: life.python-visibility
    name: "Applied AI TEST Python instance hides and the chart instance reflects it"
    category: state
    tags: ["python", "chart"]
    setup:
      - id: sidebarBefore
        type: workspace.getState
        params: {}
      - id: apply
        type: pythonIndicators.apply
        params: {"source": "def calculate(bars, params):\n    return {\"title\": \"AI TEST close\", \"overlay\": True, \"plots\": [{\"id\": \"close\", \"title\": \"Close\", \"color\": \"#22c55e\", \"values\": [bar[\"close\"] for bar in bars]}]}\n"}
        idempotencyKey: "ai-test-{{run.id}}-py-apply-pythonvisibility"
    execute:
      type: pythonIndicators.setVisibility
      params: {"instanceId": "{{steps.apply.data.instanceId}}", "visible": false}
      idempotencyKey: "ai-test-{{run.id}}-py-hide-pythonvisibility"
    assert:
      response:
        - path: status
          equals: "ok"
        - path: data.visible
          equals: false
        - path: data.instanceId
          equals: "{{steps.apply.data.instanceId}}"
      state:
        - label: "applied list reports the hidden instance"
          type: pythonIndicators.applied
          params: {}
          assertions:
          - path: data.indicators
            contains: {"instanceId": "{{steps.apply.data.instanceId}}", "visible": false}
    teardown:
      - id: remove
        type: pythonIndicators.remove
        params: {"instanceId": "{{steps.apply.data.instanceId}}"}
        idempotencyKey: "ai-test-{{run.id}}-py-remove-pythonvisibility"
      - id: restoreBottom
        type: workspace.setPanel
        params: {"panel": "{{steps.sidebarBefore.data.panels.bottom.panel}}", "expanded": "{{steps.sidebarBefore.data.panels.bottom.expanded}}"}
      - id: bottomRestored
        kind: poll
        type: workspace.getState
        params: {}
        until: {"path": "data.panels.bottom.panel", "equals": "{{steps.sidebarBefore.data.panels.bottom.panel}}"}
        intervalMs: 500
        timeoutMs: 10000

  - id: life.python-settings-roundtrip
    name: "Unchanged Python style snapshot round-trips without executing Python"
    category: state
    tags: ["python", "chart"]
    setup:
      - id: sidebarBefore
        type: workspace.getState
        params: {}
      - id: apply
        type: pythonIndicators.apply
        params: {"source": "def calculate(bars, params):\n    return {\"title\": \"AI TEST close\", \"overlay\": True, \"plots\": [{\"id\": \"close\", \"title\": \"Close\", \"color\": \"#22c55e\", \"values\": [bar[\"close\"] for bar in bars]}]}\n"}
        idempotencyKey: "ai-test-{{run.id}}-py-apply-pythonsettingsroundtrip"
      - id: gs
        kind: poll
        type: pythonIndicators.getSettings
        params: {"instanceId": "{{steps.apply.data.instanceId}}"}
        until: {"path": "status", "equals": "ok"}
        intervalMs: 1000
        timeoutMs: 15000
    execute:
      type: pythonIndicators.setSettings
      params: {"instanceId": "{{steps.apply.data.instanceId}}", "settings": "{{steps.gs.data}}", "expected": "{{steps.gs.data}}"}
      idempotencyKey: "ai-test-{{run.id}}-py-settings-pythonsettingsroundtrip"
    assert:
      response:
        - path: status
          equals: "ok"
        - path: data.plots.0.id
          equals: "close"
        - path: data.visible
          equals: true
      state:
        - label: "settings unchanged"
          type: pythonIndicators.getSettings
          params: {"instanceId": "{{steps.apply.data.instanceId}}"}
          assertions:
          - path: data
            equals: "{{steps.gs.data}}"
    teardown:
      - id: remove
        type: pythonIndicators.remove
        params: {"instanceId": "{{steps.apply.data.instanceId}}"}
        idempotencyKey: "ai-test-{{run.id}}-py-remove-pythonsettingsroundtrip"
      - id: restoreBottom
        type: workspace.setPanel
        params: {"panel": "{{steps.sidebarBefore.data.panels.bottom.panel}}", "expanded": "{{steps.sidebarBefore.data.panels.bottom.expanded}}"}
      - id: bottomRestored
        kind: poll
        type: workspace.getState
        params: {}
        until: {"path": "data.panels.bottom.panel", "equals": "{{steps.sidebarBefore.data.panels.bottom.panel}}"}
        intervalMs: 500
        timeoutMs: 10000

  - id: life.python-settings-stale
    name: "setSettings with a mismatched expected snapshot fails"
    category: contract
    tags: ["python", "errors"]
    execute:
      type: pythonIndicators.setSettings
      params: {"instanceId": "ai-test-missing", "settings": {"alias": "x", "visible": true, "plots": []}, "expected": {"alias": "", "visible": true, "plots": []}}
      idempotencyKey: "ai-test-{{run.id}}-py-settings-missing-pythonsettingsstale"
    assert:
      response:
        - path: status
          equals: "error"
        - path: code
          equals: "PYTHON_INDICATOR_NOT_FOUND"

  - id: life.python-remove-unknown
    name: "pythonIndicators.remove on an unknown instance fails"
    category: contract
    tags: ["python", "errors"]
    execute:
      type: pythonIndicators.remove
      params: {"instanceId": "ai-test-missing"}
      idempotencyKey: "ai-test-{{run.id}}-py-remove-missing-pythonremoveunknown"
    assert:
      response:
        - path: status
          equals: "error"
        - path: code
          equals: "PYTHON_INDICATOR_NOT_FOUND"

  - id: life.python-setvisibility-unknown
    name: "pythonIndicators.setVisibility on an unknown instance fails"
    category: contract
    tags: ["python", "errors"]
    execute:
      type: pythonIndicators.setVisibility
      params: {"instanceId": "ai-test-missing", "visible": false}
      idempotencyKey: "ai-test-{{run.id}}-py-setvisibility-missing-pythonsetvisibilityunkno"
    assert:
      response:
        - path: status
          equals: "error"
        - path: code
          equals: "PYTHON_INDICATOR_NOT_FOUND"

  - id: life.python-showsettings-unknown
    name: "pythonIndicators.showSettings on an unknown instance fails"
    category: contract
    tags: ["python", "errors"]
    execute:
      type: pythonIndicators.showSettings
      params: {"instanceId": "ai-test-missing"}
      idempotencyKey: "ai-test-{{run.id}}-py-showsettings-missing-pythonshowsettingsunknow"
    assert:
      response:
        - path: status
          equals: "error"
        - path: code
          equals: "PYTHON_INDICATOR_NOT_FOUND"

  - id: life.python-showinputs-unknown
    name: "pythonIndicators.showInputs on an unknown instance fails"
    category: contract
    tags: ["python", "errors"]
    execute:
      type: pythonIndicators.showInputs
      params: {"instanceId": "ai-test-missing"}
      idempotencyKey: "ai-test-{{run.id}}-py-showinputs-missing-pythonshowinputsunknown"
    assert:
      response:
        - path: status
          equals: "error"
        - path: code
          equals: "PYTHON_INDICATOR_NOT_FOUND"

  - id: life.python-apply-empty
    name: "Applying empty Python source is rejected"
    category: contract
    tags: ["python", "errors"]
    execute:
      type: pythonIndicators.apply
      params: {"source": ""}
      idempotencyKey: "ai-test-{{run.id}}-py-apply-bad-pythonapplyempty"
    assert:
      response:
        - path: status
          equals: "error"
        - path: code
          equals: "INVALID_PARAMS"

  - id: life.native-study
    name: "AI TEST native RSI: apply with inputs, hide by exact entity, remove"
    category: state
    tags: ["indicators", "chart"]
    setup:
      - id: apply
        type: studies.apply
        params: {"name": "Relative Strength Index", "inputs": {"length": 21}}
        idempotencyKey: "ai-test-{{run.id}}-study-apply-nativestudy"
    execute:
      type: studies.setVisibility
      params: {"entityId": "{{steps.apply.data.entityId}}", "name": "Relative Strength Index", "expectedVisible": true, "visible": false}
      idempotencyKey: "ai-test-{{run.id}}-study-hide-nativestudy"
    assert:
      response:
        - path: status
          equals: "ok"
        - path: data.entityId
          equals: "{{steps.apply.data.entityId}}"
        - path: data.visible
          equals: false
      state:
        - label: "applied list shows the hidden study"
          type: studies.applied
          params: {"limit": 50}
          assertions:
          - path: data.studies
            contains: {"entityId": "{{steps.apply.data.entityId}}", "visible": false}
    teardown:
      - id: remove
        type: studies.remove
        params: {"entityId": "{{steps.apply.data.entityId}}", "name": "Relative Strength Index", "expectedVisible": false}
        idempotencyKey: "ai-test-{{run.id}}-study-remove-nativestudy"

  - id: life.native-study-unknown
    name: "Applying an unknown native study fails"
    category: contract
    tags: ["indicators", "errors"]
    execute:
      type: studies.apply
      params: {"name": "AI TEST no such study"}
      idempotencyKey: "ai-test-{{run.id}}-study-apply-bad-nativestudyunknown"
    assert:
      response:
        - path: status
          equals: "error"
        - path: code
          equals: "NATIVE_STUDY_NOT_FOUND"

  - id: life.native-study-vis-unknown
    name: "Changing visibility of an unknown study fails"
    category: contract
    tags: ["indicators", "errors"]
    execute:
      type: studies.setVisibility
      params: {"entityId": "ai-test-missing", "name": "Relative Strength Index", "expectedVisible": true, "visible": false}
      idempotencyKey: "ai-test-{{run.id}}-study-vis-bad-nativestudyvisunknown"
    assert:
      response:
        - path: status
          equals: "error"
        - path: code
          equals: "NATIVE_STUDY_NOT_FOUND"

  - id: life.native-study-remove-unknown
    name: "Removing an unknown study fails"
    category: contract
    tags: ["indicators", "errors"]
    execute:
      type: studies.remove
      params: {"entityId": "ai-test-missing", "name": "Relative Strength Index", "expectedVisible": true}
      idempotencyKey: "ai-test-{{run.id}}-study-rm-bad-nativestudyremoveunknown"
    assert:
      response:
        - path: status
          equals: "error"
        - path: code
          equals: "NATIVE_STUDY_NOT_FOUND"

  - id: life.study-templates-list
    name: "Study templates list is bounded"
    category: contract
    tags: ["indicators"]
    execute:
      kind: poll
      type: studyTemplates.manage
      params: {"action": "list", "limit": 5}
      idempotencyKey: "ai-test-{{run.id}}-tpl-list-studytemplateslist"
      until: {"path": "status", "equals": "ok"}
      intervalMs: 1000
      timeoutMs: 30000
    assert:
      response:
        - path: status
          equals: "ok"
        - path: data.items
          type: "array"
        - path: data.items.length
          lte: 5
        - path: data.total
          gte: 0
        - path: data.truncated
          type: "boolean"

  - id: life.study-templates-apply-unconfirmed
    name: "Applying a study template without confirm is rejected"
    category: contract
    tags: ["indicators", "errors"]
    execute:
      type: studyTemplates.manage
      params: {"action": "apply", "name": "AI TEST missing"}
      idempotencyKey: "ai-test-{{run.id}}-tpl-apply-bad-studytemplatesapplyuncon"
    assert:
      response:
        - path: status
          equals: "error"
        - path: code
          equals: "INVALID_PARAMS"

  - id: life.pine-openeditor-invalid
    name: "indicators.openEditor with an unknown target or invalid input fails and leaves the bottom panel unchanged"
    category: contract
    tags: ["indicators", "pine", "errors"]
    setup:
      - id: sidebarBefore
        type: workspace.getState
        params: {}
    execute:
      type: indicators.openEditor
      params: {"id": "ai-test-missing"}
      idempotencyKey: "ai-test-{{run.id}}-pine-openeditor-bad-pineopeneditorinvalid"
    assert:
      response:
        - path: status
          equals: "error"
        - path: code
          equals: "INDICATOR_NOT_FOUND"
      state:
        - label: "bottom panel is unchanged"
          kind: poll
          type: workspace.getState
          params: {}
          until: {"path": "data.panels.bottom", "equals": "{{steps.sidebarBefore.data.panels.bottom}}"}
          intervalMs: 500
          timeoutMs: 5000
          assertions:
          - path: data.panels.indicatorStudio.visible
            equals: "{{steps.sidebarBefore.data.panels.indicatorStudio.visible}}"
    teardown:
      - id: restoreBottom
        type: workspace.setPanel
        params: {"panel": "{{steps.sidebarBefore.data.panels.bottom.panel}}", "expanded": "{{steps.sidebarBefore.data.panels.bottom.expanded}}"}
      - id: bottomRestored
        kind: poll
        type: workspace.getState
        params: {}
        until: {"path": "data.panels.bottom.panel", "equals": "{{steps.sidebarBefore.data.panels.bottom.panel}}"}
        intervalMs: 500
        timeoutMs: 10000

  - id: life.pine-applypurchased-invalid
    name: "indicators.applyPurchased with an unknown target or invalid input fails"
    category: contract
    tags: ["indicators", "pine", "errors"]
    execute:
      type: indicators.applyPurchased
      params: {"shareId": ""}
      idempotencyKey: "ai-test-{{run.id}}-pine-applypurchased-bad-pineapplypurchasedinvali"
    assert:
      response:
        - path: status
          equals: "error"
        - path: code
          equals: "INVALID_PARAMS"

  - id: life.pine-publishpaid-invalid
    name: "indicators.publishPaid with an unknown target or invalid input fails"
    category: contract
    tags: ["indicators", "pine", "errors"]
    execute:
      type: indicators.publishPaid
      params: {"id": "ai-test-missing", "expectedRevision": 1, "amountMinor": 0, "termDays": 30, "visibility": "link"}
      idempotencyKey: "ai-test-{{run.id}}-pine-publishpaid-bad-pinepublishpaidinvalid"
    assert:
      response:
        - path: status
          equals: "error"
        - path: code
          equals: "INVALID_PARAMS"

  - id: life.pine-save-invalid
    name: "indicators.save with an unknown target or invalid input fails"
    category: contract
    tags: ["indicators", "pine", "errors"]
    execute:
      type: indicators.save
      params: {"source": ""}
      idempotencyKey: "ai-test-{{run.id}}-pine-save-bad-pinesaveinvalid"
    assert:
      response:
        - path: status
          equals: "error"
        - path: code
          equals: "INVALID_PARAMS"

  - id: life.pine-opendraft-invalid
    name: "indicators.openDraft with an unknown target or invalid input fails and leaves the bottom panel unchanged"
    category: contract
    tags: ["indicators", "pine", "errors"]
    setup:
      - id: sidebarBefore
        type: workspace.getState
        params: {}
    execute:
      type: indicators.openDraft
      params: {"source": "   "}
      idempotencyKey: "ai-test-{{run.id}}-pine-opendraft-bad-pineopendraftinvalid"
    assert:
      response:
        - path: status
          equals: "error"
        - path: code
          equals: "INVALID_PARAMS"
      state:
        - label: "bottom panel is unchanged"
          kind: poll
          type: workspace.getState
          params: {}
          until: {"path": "data.panels.bottom", "equals": "{{steps.sidebarBefore.data.panels.bottom}}"}
          intervalMs: 500
          timeoutMs: 5000
          assertions:
          - path: data.panels.indicatorStudio.visible
            equals: "{{steps.sidebarBefore.data.panels.indicatorStudio.visible}}"
    teardown:
      - id: restoreBottom
        type: workspace.setPanel
        params: {"panel": "{{steps.sidebarBefore.data.panels.bottom.panel}}", "expanded": "{{steps.sidebarBefore.data.panels.bottom.expanded}}"}
      - id: bottomRestored
        kind: poll
