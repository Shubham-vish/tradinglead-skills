version: 1
suite:
  id: "simulation-aliases"
  name: "simulation.* compatibility aliases"
  description: "Every simulation.* compatibility alias is exercised with the same read or error-path contract as its canonical backtesting.* command (cloned from reads-contract and indicator-lifecycle), proving the alias routes to the same handler and error codes. Only unknown IDs, invalid params and reads are sent; no run, preset or library item is created and the user's runs are never touched."
  requires:
    grants: ["allowAgentIndicators"]
    signIn: true

tests:
  - id: alias.capabilities
    name: "Alias simulation.capabilities: Capabilities describe simulation-only execution"
    category: contract
    tags: ["backtesting", "alias"]
    execute:
      type: simulation.capabilities
      params: {}
    assert:
      response:
        - path: status
          equals: "ok"
        - path: data.liveBrokerOrders
          equals: false
        - path: data.modes
          contains: "backtest"

  - id: alias.python-config-rejected-for-pine
    name: "Alias simulation.run: Generic Python config is rejected for a Pine run"
    category: contract
    tags: ["backtesting", "alias", "pine", "errors"]
    execute:
      type: simulation.run
      params: {"language": "pine", "source": "//@version=5\nstrategy(\"AI TEST SMA cross\", overlay=true, initial_capital=100000)\nfastLen = input.int(10, \"Fast\", minval=2)\nslowLen = input.int(30, \"Slow\", minval=3)\nfast = ta.sma(close, fastLen)\nslow = ta.sma(close, slowLen)\nif ta.crossover(fast, slow)\n    strategy.entry(\"Long\", strategy.long)\nif ta.crossunder(fast, slow)\n    strategy.close(\"Long\")\n", "config": {"initialCapital": 5000}, "bars": 200}
      idempotencyKey: "ai-test-{{run.id}}-alias-bt-badconfig-pythonconfigrejectedforp"
    assert:
      response:
        - path: status
          equals: "error"
        - path: code
          exists: true

  - id: alias.unknown-run
    name: "Alias simulation.get: Reading an unknown run ID fails explicitly"
    category: contract
    tags: ["backtesting", "alias", "errors"]
    execute:
      type: simulation.get
      params: {"runId": "sim-ai-test-does-not-exist"}
    assert:
      response:
        - path: status
          equals: "error"
        - path: code
          exists: true

  - id: alias.chart-options-invalid
    name: "Alias simulation.setChartOptions: Chart options reject a non-boolean markers value"
    category: contract
    tags: ["backtesting", "alias", "errors"]
    execute:
      type: simulation.setChartOptions
      params: {"options": {"markers": "x"}}
      idempotencyKey: "ai-test-{{run.id}}-alias-bt-options-bad-chartoptionsinvalid"
    assert:
      response:
        - path: status
          equals: "error"
        - path: code
          equals: "INVALID_PARAMS"

  - id: alias.bt-practice-invalid
    name: "Alias simulation.practice: backtesting.practice with an unknown run or invalid input fails without side effects"
    category: contract
    tags: ["backtesting", "alias", "errors"]
    execute:
