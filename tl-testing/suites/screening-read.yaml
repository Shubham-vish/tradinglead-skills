    teardown:
      - id: restoreSidebar
        type: workspace.openSidebar
        params: {"panel": "{{steps.sidebarBefore.data.sidebar.panel}}", "expanded": "{{steps.sidebarBefore.data.sidebar.expanded}}"}
      - id: sidebarRestored
        kind: poll
        type: workspace.getState
        params: {}
        until: {"path": "data.sidebar.panel", "equals": "{{steps.sidebarBefore.data.sidebar.panel}}"}
        intervalMs: 500
        timeoutMs: 10000

  - id: scanread.refine-stale
    name: "Refine with a stale draft revision reports a conflict"
    category: contract
    tags: ["screening", "errors"]
    setup:
      - id: sidebarBefore
        type: workspace.getState
        params: {}
      - id: draft
        type: screening.getState
        params: {}
    execute:
      type: screening.refine
      params: {"runId": "ai-test-missing", "expectedRevision": 999999, "expectedAnalysisRevision": 1, "scope": "filtered"}
    assert:
      response:
        - path: status
          equals: "error"
        - path: code
          oneOf: ["REVISION_CONFLICT", "RUN_NOT_FOUND", "INVALID_PARAMS"]
    teardown:
      - id: restoreSidebar
        type: workspace.openSidebar
        params: {"panel": "{{steps.sidebarBefore.data.sidebar.panel}}", "expanded": "{{steps.sidebarBefore.data.sidebar.expanded}}"}
      - id: sidebarRestored
        kind: poll
        type: workspace.getState
        params: {}
        until: {"path": "data.sidebar.panel", "equals": "{{steps.sidebarBefore.data.sidebar.panel}}"}
        intervalMs: 500
        timeoutMs: 10000

  - id: scanread.set-analysis-unknown
    name: "Changing analysis of a run that is not visible fails"
    category: contract
    tags: ["screening", "errors"]
    setup:
      - id: sidebarBefore
        type: workspace.getState
        params: {}
      - id: draft
        type: screening.getState
        params: {}
    execute:
      type: screening.setAnalysis
      params: {"runId": "ai-test-missing", "expectedAnalysisRevision": 1, "search": "x"}
    assert:
      response:
        - path: status
          equals: "error"
        - path: code
          equals: "RUN_NOT_FOUND"
