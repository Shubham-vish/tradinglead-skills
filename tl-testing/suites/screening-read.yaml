  - id: patread.show
    name: "patterns.show opens Historical Patterns without changing the study"
    category: state
    tags: ["patterns", "ui"]
    setup:
      - id: sidebarBefore
        type: workspace.getState
        params: {}
      - id: pat
        type: patterns.getState
        params: {}
    execute:
      type: patterns.show
      params: {"expanded": false}
    assert:
      response:
        - path: status
          equals: "ok"
        - path: data.visible
          equals: true
      state:
        - label: "study draft unchanged"
          type: patterns.getState
          params: {}
          assertions:
          - path: data.revision
            equals: "{{steps.pat.data.revision}}"
          - path: data.visible
            equals: true
    teardown:
      - id: restoreSidebar
        type: workspace.openSidebar
        params: {"panel": "{{steps.sidebarBefore.data.sidebar.panel}}", "expanded": "{{steps.sidebarBefore.data.sidebar.expanded}}"}
      - id: sidebarRestored
        kind: poll
        type: workspace.getState
        params: {}
        until: {"path": "data.sidebar.panel", "equals": "{{steps.sidebarBefore.data.sidebar.panel}}"}
        intervalMs: 500
        timeoutMs: 10000

  - id: patread.hide
