version: 1
suite:
  id: "screening-read"
  name: "Scanner and Patterns without quota"
  description: "Exercises Scanner and Historical Patterns commands that never execute a scan or study: view switching, draft revision guards, unknown run/history IDs and analysis on missing results. Opening the Scanner/Patterns is restored from the sidebar read in setup; the draft is re-applied unchanged. Consumes no scan allowance or provider quota."
  requires:
    grants: []
    signIn: true

tests:
  - id: scanread.show-history
    name: "screening.show switches to Scanned History without executing"
    category: state
    tags: ["screening", "ui"]
    setup:
      - id: sidebarBefore
        type: workspace.getState
        params: {}
      - id: draft
        type: screening.getState
        params: {}
    execute:
      type: screening.show
      params: {"view": "history"}
    assert:
      response:
        - path: status
          equals: "ok"
        - path: data.view
          equals: "history"
        - path: data.executed
          equals: false
        - path: data.visible
          equals: true
      state:
        - label: "state reports the history view and the draft is unchanged"
          type: screening.getState
          params: {}
          assertions:
          - path: data.view
            equals: "history"
          - path: data.revision
            equals: "{{steps.draft.data.revision}}"
    teardown:
      - id: backToScanner
        type: screening.show
        params: {"view": "{{steps.draft.data.view}}"}
      - id: restoreSidebar
        type: workspace.openSidebar
        params: {"panel": "{{steps.sidebarBefore.data.sidebar.panel}}", "expanded": "{{steps.sidebarBefore.data.sidebar.expanded}}"}
      - id: sidebarRestored
        kind: poll
        type: workspace.getState
        params: {}
        until: {"path": "data.sidebar.panel", "equals": "{{steps.sidebarBefore.data.sidebar.panel}}"}
        intervalMs: 500
        timeoutMs: 10000

  - id: scanread.show-invalid
    name: "screening.show rejects an unknown view"
    category: contract
    tags: ["screening", "errors"]
    execute:
      type: screening.show
      params: {"view": "bogus"}
    assert:
      response:
        - path: status
          equals: "error"
        - path: code
          equals: "INVALID_PARAMS"

  - id: scanread.configure-stale
    name: "configure with a stale revision is rejected and leaves the draft intact"
    category: contract
    tags: ["screening", "errors"]
    setup:
      - id: sidebarBefore
        type: workspace.getState
        params: {}
      - id: draft
        type: screening.getState
        params: {}
    execute:
      type: screening.configure
      params: {"definition": {"mode": "preset", "preset": "gainers"}, "expectedRevision": -1}
    assert:
      response:
        - path: status
          equals: "error"
        - path: code
          equals: "INVALID_PARAMS"
      state:
        - label: "draft revision unchanged"
          type: screening.getState
          params: {}
          assertions:
          - path: data.revision
            equals: "{{steps.draft.data.revision}}"
    teardown:
      - id: restoreSidebar
        type: workspace.openSidebar
        params: {"panel": "{{steps.sidebarBefore.data.sidebar.panel}}", "expanded": "{{steps.sidebarBefore.data.sidebar.expanded}}"}
      - id: sidebarRestored
        kind: poll
        type: workspace.getState
        params: {}
        until: {"path": "data.sidebar.panel", "equals": "{{steps.sidebarBefore.data.sidebar.panel}}"}
        intervalMs: 500
        timeoutMs: 10000

  - id: scanread.configure-same
    name: "Re-applying the current definition bumps the revision without running"
    category: state
    tags: ["screening"]
    setup:
      - id: sidebarBefore
        type: workspace.getState
        params: {}
      - id: draft
        type: screening.getState
        params: {}
    execute:
      type: screening.configure
      params: {"definition": "{{steps.draft.data.definition}}", "expectedRevision": "{{steps.draft.data.revision}}"}
    assert:
      response:
        - path: status
          equals: "ok"
        - path: data.applied
          equals: true
        - path: data.executed
          equals: false
      state:
        - label: "revision not regressed, no run started and definition unchanged"
          type: screening.getState
          params: {}
          assertions:
          - path: data.revision
            gte: "{{steps.draft.data.revision}}"
          - path: data.run
            equals: null
          - path: data.definition.mode
            equals: "{{steps.draft.data.definition.mode}}"
    teardown:
      - id: restoreSidebar
        type: workspace.openSidebar
        params: {"panel": "{{steps.sidebarBefore.data.sidebar.panel}}", "expanded": "{{steps.sidebarBefore.data.sidebar.expanded}}"}
      - id: sidebarRestored
        kind: poll
        type: workspace.getState
        params: {}
        until: {"path": "data.sidebar.panel", "equals": "{{steps.sidebarBefore.data.sidebar.panel}}"}
        intervalMs: 500
        timeoutMs: 10000

  - id: scanread.load-stale
    name: "Loading saved rules with a stale revision is rejected"
    category: contract
    tags: ["screening", "errors"]
    setup:
      - id: sidebarBefore
        type: workspace.getState
        params: {}
      - id: draft
        type: screening.getState
        params: {}
    execute:
      type: screening.load
      params: {"id": "ai-test-missing", "expectedRevision": -1}
    assert:
      response:
        - path: status
          equals: "error"
        - path: code
          equals: "INVALID_PARAMS"
    teardown:
      - id: restoreSidebar
        type: workspace.openSidebar
