  - id: patread.chart-ticker
    name: "useChartTicker copies the ready chart ticker into the draft without executing"
    category: state
    tags: ["patterns"]
    setup:
      - id: sidebarBefore
        type: workspace.getState
        params: {}
      - id: chart
        type: chart.getState
        params: {}
      - id: pat
        type: patterns.getState
        params: {}
    execute:
      type: patterns.useChartTicker
      params: {"expectedRevision": "{{steps.pat.data.revision}}"}
    assert:
      response:
        - path: status
          equals: "ok"
        - path: data.revision
          gte: "{{steps.pat.data.revision}}"
      state:
        - label: "draft symbol is the chart symbol and no job started"
          type: patterns.getState
          params: {}
          assertions:
          - path: data.draft.symbol
            equals: "{{steps.chart.data.symbol}}"
          - path: data.job.status
            equals: "{{steps.pat.data.job.status}}"
    teardown:
      - id: restoreDraft
        type: patterns.configure
        params: {"query": "{{steps.pat.data.draft}}", "expectedRevision": "{{steps.execute.data.revision}}"}
      - id: restoreSidebar
        type: workspace.openSidebar
        params: {"panel": "{{steps.sidebarBefore.data.sidebar.panel}}", "expanded": "{{steps.sidebarBefore.data.sidebar.expanded}}"}
      - id: sidebarRestored
        kind: poll
        type: workspace.getState
        params: {}
        until: {"path": "data.sidebar.panel", "equals": "{{steps.sidebarBefore.data.sidebar.panel}}"}
