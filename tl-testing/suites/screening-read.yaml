    category: state
    tags: ["patterns", "ui"]
    setup:
      - id: sidebarBefore
        type: workspace.getState
        params: {}
      - id: pat
        type: patterns.getState
        params: {}
    execute:
      type: patterns.hide
      params: {}
    assert:
      response:
        - path: status
          equals: "ok"
        - path: data.visible
          equals: false
      state:
        - label: "sidebar no longer shows patterns"
          type: workspace.getState
          params: {}
          assertions:
          - path: data.sidebar.panel
            notEquals: "patterns"
    teardown:
      - id: restoreSidebar
        type: workspace.openSidebar
        params: {"panel": "{{steps.sidebarBefore.data.sidebar.panel}}", "expanded": "{{steps.sidebarBefore.data.sidebar.expanded}}"}
      - id: sidebarRestored
