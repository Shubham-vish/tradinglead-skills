      - id: sidebarRestored
        kind: poll
        type: workspace.getState
        params: {}
        until: {"path": "data.sidebar.panel", "equals": "{{steps.sidebarBefore.data.sidebar.panel}}"}
        intervalMs: 500
        timeoutMs: 10000

  - id: scanread.open-history-unknown
    name: "Opening an unknown history snapshot fails without rerunning"
    category: contract
    tags: ["screening", "errors"]
    setup:
      - id: sidebarBefore
        type: workspace.getState
        params: {}
      - id: draft
        type: screening.getState
        params: {}
    execute:
      type: screening.openHistory
      params: {"id": "ai-test-missing"}
    assert:
      response:
        - path: status
          equals: "error"
        - path: code
          equals: "HISTORY_NOT_FOUND"
      state:
        - label: "draft unchanged"
          type: screening.getState
          params: {}
          assertions:
          - path: data.revision
