      - id: sidebarBefore
        type: workspace.getState
        params: {}
    execute:
      type: patterns.getResults
      params: {"runId": "ai-test-missing"}
    assert:
      response:
        - path: status
          equals: "error"
        - path: code
          oneOf: ["PATTERN_RUN_NOT_FOUND", "PATTERNS_NOT_READY"]
      state:
        - label: "the command left the sidebar unchanged"
          type: workspace.getState
          params: {}
          assertions:
          - path: data.sidebar
            equals: "{{steps.sidebarBefore.data.sidebar}}"
