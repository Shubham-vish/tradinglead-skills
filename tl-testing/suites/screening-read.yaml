        timeoutMs: 10000

  - id: patread.cancel-unknown
    name: "Cancelling an unknown study job fails"
    category: contract
    tags: ["patterns", "errors"]
    setup:
      - id: sidebarBefore
        type: workspace.getState
        params: {}
      - id: pat
