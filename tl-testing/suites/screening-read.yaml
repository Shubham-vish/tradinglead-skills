  - id: patread.show-invalid
    name: "patterns.show rejects a non-boolean expanded"
    category: contract
    tags: ["patterns", "errors"]
    execute:
      type: patterns.show
      params: {"expanded": "yes"}
    assert:
      response:
        - path: status
          equals: "error"
        - path: code
          equals: "INVALID_PARAMS"

  - id: patread.chart-ticker-stale
